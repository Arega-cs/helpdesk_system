{% extends 'base.html' %}
{% block content %}
<div class="card col-md-4 mx-auto p-4 shadow-sm">
    <h3 class="mb-3 text-center">login the system</h3>
    <p class="text-muted small text-center">try: <b>user1</b> or <b>tech1</b> to log in</p>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">የተጠቃሚ ስም (Username)</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">login</button>
    </form>
</div>
{% endblock %}
